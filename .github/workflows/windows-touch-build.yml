# Fork-only. Builds just the Windows Flutter client, for iterating on tablet
# mode (touch/mouse mode, pinch zoom, the in-app touch keyboard).
#
# The existing callers -- ci.yml, flutter-nightly.yml, flutter-tag.yml -- all run
# the full twelve-job matrix, which spends nine jobs on iOS, Android, Linux,
# appimage, flatpak, web and the sciter clients. None of those are touched by this
# work, so this passes `windows-only` and skips them.
#
# Run it from the Actions tab, picking the branch to build. The portable client
# lands in the `rustdesk-unsigned-windows-x86_64` artifact.
#
# Note: the Windows job's matrix also has an aarch64 entry that needs a
# `windows-11-arm` runner. Those may be unavailable on a personal fork, in which
# case that one job fails -- `fail-fast: false` means the x86_64 build still
# completes and still uploads. A red arm64 job is expected and harmless here.
name: Windows Touch Build

# Triggers on push to the tablet-touch branch rather than only by hand. A
# `workflow_dispatch` workflow gets its "Run workflow" button only when the file
# is on the repository's default branch, and this one deliberately isn't -- it's
# fork-only and shouldn't be pushed to master to earn a button. `push` has no such
# requirement and uses the definition from the pushed branch, so every commit to
# the branch builds on its own.
on:
  push:
    branches:
      - feat/windows-tablet-touch
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      upload-tag:
        description: "Tag to label the uploaded artifacts with."
        type: string
        default: "windows-touch"

# One run per branch at a time. Three pushes in quick succession put three runs in
# flight at once, all publishing to the same release tag and racing to overwrite
# each other's assets -- whichever finished last won, which is not necessarily the
# newest code. Superseded runs are cancelled instead.
concurrency:
  group: windows-touch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-only:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      # `inputs` is empty on a push event, which would pass "" and override
      # flutter-build's own default, so fall back explicitly.
      upload-tag: ${{ inputs.upload-tag || 'windows-touch' }}
      windows-only: true
